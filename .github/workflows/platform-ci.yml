name: Platform CI (Phase 2+)

on:
  push:
    branches: [main]
    paths: ['apps/platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['apps/platform/**', '.github/workflows/platform-ci.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barakah_test
          POSTGRES_USER: barakah
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U barakah" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/platform
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: barakah_test
      DB_USERNAME: barakah
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, intl, mbstring, xml, curl, zip
          tools: composer:v2
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Migrations run on PostgreSQL
        run: php artisan migrate:fresh --seed --force 2>&1 | tee migrate.log; exit ${PIPESTATUS[0]}
      - name: PHPUnit (PostgreSQL)
        run: php artisan test --log-junit junit.xml 2>&1 | tee phpunit.log; exit ${PIPESTATUS[0]}
      - name: Surface migrate errors as annotations
        if: failure()
        working-directory: ${{ github.workspace }}
        run: grep -iE "error|exception|SQLSTATE|does not exist|already exists" apps/platform/migrate.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done; true
      - name: Upload migrate log
        if: failure()
        uses: actions/upload-artifact@v5
        with: { name: migrate-log, path: 'apps/platform/migrate.log' }
      - name: Write test failures to job summary
        if: failure()
        working-directory: apps/platform
        run: |
          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET, os
          try:
              tree = ET.parse('junit.xml')
              lines = ['## PHPUnit failures']
              for tc in tree.iter('testcase'):
                  for f in list(tc):
                      if f.tag in ('failure','error'):
                          lines.append(f"### {tc.get('classname')}::{tc.get('name')}")
                          lines.append((f.text or '')[:1500])
              open(os.environ['GITHUB_STEP_SUMMARY'],'a').write('\n'.join(lines) or 'no junit')
          except Exception as e:
              open(os.environ['GITHUB_STEP_SUMMARY'],'a').write(f'junit parse failed: {e}')
          PYEOF
      - name: Surface test failures as annotations
        if: failure()
        working-directory: ${{ github.workspace }}
        run: grep -E "FAIL|Failed|Error|Tests:|✗|⨯" apps/platform/phpunit.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done; true
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with: { name: phpunit-diagnostics, path: 'apps/platform/phpunit.log' }
